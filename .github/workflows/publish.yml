name: Publish

on:
  workflow_dispatch:

  push:
    branches:
      - "main"

  pull_request:
    branches:
      - "main"

jobs:

  all:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Get task
        run: |
          curl --silent --show-error --location 'https://github.com/go-task/task/releases/download/v3.29.1/task_linux_amd64.tar.gz' \
            | tar -xzf - -C /usr/local/bin task

      - name: Test
        run: task test

      - name: Run Python SDK tests
        run: |
          # The SDK tests need a running httpbun instance, so build one and
          # start it on localhost:3090 for the duration of this step.
          go build -o /tmp/httpbun .
          /tmp/httpbun --bind localhost:3090 &
          httpbun_pid=$!
          trap 'kill "$httpbun_pid" 2>/dev/null || true' EXIT

          # Wait for the server to be ready.
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3090/any >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://localhost:3090/any >/dev/null

          # Install uv for the Python SDK test suite.
          curl --silent --show-error --location 'https://astral.sh/uv/install.sh' | sh
          export PATH="$HOME/.local/bin:$PATH"

          # Run the lint + Python SDK tests (task llm-sdk-tests).
          task llm-sdk-tests

      - name: Build binaries
        run: task docker

      - name: Build and Push Docker images to GHCR and DockerHub
        if: |
          success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker buildx create --use

          tag_name="$(echo "${{ github.ref_name }}" | sed 's/^main$/latest/')"

          declare -a tags
          tags+=(--tag "${{ vars.DOCKER_HUB_USERNAME }}/httpbun:$tag_name")
          tags+=(--tag "ghcr.io/${{ github.actor }}/httpbun:$tag_name")
          if [[ "$tag_name" == latest ]]; then
            tags+=(--tag "${{ vars.DOCKER_HUB_USERNAME }}/httpbun:${{ github.sha }}")
          fi

          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          echo "${{ secrets.DOCKER_HUB_PASSWORD }}" | docker login --username "${{ vars.DOCKER_HUB_USERNAME }}" --password-stdin

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --push "${tags[@]}" \
            --label "org.opencontainers.image.authors=${{ vars.DOCKER_IMAGE_MAINTAINER }}" \
            .
