version: "3"

vars:
  COMMIT:
    sh: |-
      git rev-parse HEAD
  NOW:
    sh: |-
      date -u +%FT%TZ
  LD_FLAGS: >-
    -ldflags '-X github.com/sharat87/httpbun/server/spec.Commit={{.COMMIT}} -X github.com/sharat87/httpbun/server/spec.Date={{.NOW}}'
  GOIMPORTS_VERSION: v0.31.0
  STATICCHECK_VERSION: 2026.2.1
  # Directories of all Go packages, which leaves out any nested worktrees, unlike `.`.
  GO_DIRS: go list -f '{{"{{"}}.Dir{{"}}"}}' ./...
  proxy:
    sh: |
      # Disable setting proxy automatically for now. We'll come back.
      nc -z 127.0.0.1 9020 2>/dev/null && echo -n "http://127.0.0.1:9020" || echo -n ""

tasks:
  run:
    deps:
      - fmt
    cmds:
      - go mod tidy
      - go run {{.LD_FLAGS}} . --bind localhost:3090

  docker:
    env:
      CGO_ENABLED: 0
      GOOS: linux
    cmds:
      - GOARCH=amd64 go build {{.LD_FLAGS}} -a -installsuffix cgo -o bin/httpbun-docker-amd64 .
      - GOARCH=arm64 go build {{.LD_FLAGS}} -a -installsuffix cgo -o bin/httpbun-docker-arm64 .

  check:
    desc: Run all checks, the same as CI. This passing means a change is done.
    cmds:
      - task: fmt-check
      - task: lint
      - task: test
      - task: llm-sdk-tests

  fmt:
    desc: Format Go and Python code.
    deps:
      - goimports
    cmds:
      - ./bin/goimports -w -local github.com/sharat87/httpbun $({{.GO_DIRS}})
      - cd llm-sdk-tests && uv run ruff check --fix . && uv run ruff format .

  fmt-check:
    desc: Fail if any Go or Python code isn't formatted. Run `task fmt` to fix.
    deps:
      - goimports
    cmds:
      - |
        unformatted="$(./bin/goimports -l -local github.com/sharat87/httpbun $({{.GO_DIRS}}))"
        if [ -n "$unformatted" ]; then
          echo "Not formatted, run 'task fmt':"
          echo "$unformatted"
          exit 1
        fi
      - cd llm-sdk-tests && uv run ruff check . && uv run ruff format --check .

  lint:
    desc: Run go vet and staticcheck.
    cmds:
      - go vet ./...
      - go run honnef.co/go/tools/cmd/staticcheck@{{.STATICCHECK_VERSION}} ./...

  goimports:
    internal: true
    cmds:
      - mkdir -p bin && GOBIN="$PWD/bin" go install golang.org/x/tools/cmd/goimports@{{.GOIMPORTS_VERSION}}
    status:
      - test -x ./bin/goimports

  test:
    desc: Run the Go tests.
    cmds:
      # The `-count=1` is to disable test caching.
      - go test -count=1 ./...

  llm-sdk-tests:
    desc: Run the LLM mock tests with the real OpenAI and Anthropic SDKs, against a server started for them.
    aliases: [st]
    env:
      HTTP_PROXY: "{{.proxy}}"
      HTTPS_PROXY: "{{.proxy}}"
      NO_PROXY: localhost,127.0.0.1
      no_proxy: localhost,127.0.0.1
    cmds:
      - bash llm-sdk-tests/run.sh
